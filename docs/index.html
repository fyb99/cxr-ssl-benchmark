<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="胸片自监督预训练模型的下游结果与评测记录。">
  <title>胸片模型评测台</title>
  <style>:root {
  color-scheme: light;
  --page: #edf3f2;
  --surface: #fff;
  --ink: #173537;
  --muted: #516769;
  --line: #d9e5e3;
  --tint: #e8f3ef;
  --green: #156848;
  --blue: #315d79;
  --negative: #9b454c;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--page); font-size: 1rem; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid #317ba3; outline-offset: 3px; }
.shell { max-width: 1320px; width: calc(100% - 5rem); margin-inline: auto; }
.masthead { background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); }
.mast-inner { min-height: 72px; display: flex; align-items: center; gap: 2rem; }
.brand { display: flex; gap: .72rem; align-items: center; font-weight: 750; letter-spacing: .02em; white-space: nowrap; }
.brand small { display: block; font-size: .67rem; line-height: 1.3; letter-spacing: .14em; color: var(--muted); }
.mark { color: #c1eadb; background: #164d47; width: 40px; height: 40px; border-radius: 12px; }
.mark svg { width: 100%; height: 100%; }
nav { display: flex; align-items: center; gap: 1.5rem; margin-left: auto; font-size: .875rem; }
nav a { color: var(--muted); font-weight: 650; }
nav a:hover { color: var(--green); text-decoration: underline; }
.mast-label { background: var(--tint); color: var(--green); border-radius: 50px; padding: .45rem .78rem; font-size: .875rem; font-weight: 700; }
.hero {
  margin: 2rem 0 2.25rem; min-height: 238px; border-radius: 22px; padding: 2.25rem 2.5rem;
  background: radial-gradient(ellipse at 86% 24%, #215864 0, transparent 47%), linear-gradient(125deg, #112f34, #173c43);
  color: #f2fcfb; display: grid; grid-template-columns: minmax(0,1fr) minmax(260px,315px); align-items: center; gap: 2rem;
  position: relative; isolation: isolate; overflow: hidden;
}
.hero::before { content: ""; position: absolute; z-index: -1; inset: 0; opacity: .22; background: repeating-linear-gradient(90deg, transparent 0 38px,#71b4bc66 39px 40px),repeating-linear-gradient(0deg,transparent 0 38px,#71b4bc66 39px 40px); mask-image: linear-gradient(110deg,transparent,black); }
.eyebrow { display: flex; align-items: center; gap: .6rem; font-size: .875rem; letter-spacing: .08em; font-weight: 680; color: #afdbd4; }
.eyebrow span { width: 22px; height: 2px; background: #8fd2bd; }
h1 { font-size: clamp(2.2rem, 4.1vw, 3.65rem); line-height: 1.12; letter-spacing: -.045em; margin: .6rem 0 .9rem; }
.hero p { color: #cee4e2; max-width: 40rem; margin: 0; line-height: 1.7; }
.focus { border: 1px solid #84b9b457; background: #0b292f91; padding: 1.15rem 1.25rem; border-radius: 15px; }
.focus-label, #last-updated { color: #b1d7d4; font-size: .875rem; }
.focus-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: .5rem 1rem; justify-content: space-between; margin: .55rem 0 .8rem; }
.focus-main strong { font-size: 1.25rem; letter-spacing: -.02em; }
#progress-count { font-size: .95rem; font-weight: 700; font-variant-numeric: tabular-nums; color: #c0ead6; }
.progress { height: 7px; display: flex; gap: 4px; margin-bottom: .65rem; }
.progress span { flex: 1; background: #799a9e58; border-radius: 3px; }
.progress .done { background: #8cddbd; }
.progress .running { background: #64a7b9; }
.section-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: .9rem; }
.kicker { font-size: .75rem; letter-spacing: .15em; color: var(--green); font-weight: 750; }
h2 { margin: .15rem 0 0; font-size: 1.7rem; letter-spacing: -.03em; }
.export { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: .55rem .83rem; color: var(--ink); font-weight: 700; font-size: .875rem; }
.export:hover { background: var(--tint); }
.toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: .75rem; margin: .7rem 0 1rem; }
.filters { display: flex; gap: 3px; border-radius: 10px; background: #dde9e7; padding: 3px; }
.filters button { border: 0; background: transparent; padding: .48rem .8rem; min-width: 48px; border-radius: 8px; font-size: .875rem; color: var(--muted); font-weight: 680; }
.filters button[aria-pressed="true"] { background: white; box-shadow: 0 1px 3px #1a535b24; color: var(--ink); }
.legend { color: var(--muted); font-size: .875rem; display: inline-flex; gap: .55rem; align-items: center; flex-wrap: wrap; }
.legend i { width: 11px; height: 11px; display: inline-block; background: #bddbce; border-radius: 3px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 15px; margin: .85rem 0; overflow: hidden; }
.card-heading { padding: .9rem 1.05rem; display: flex; justify-content: space-between; align-items: center; gap: .5rem; border-bottom: 1px solid var(--line); }
h3 { font-size: 1rem; margin: 0; }
.card-heading span { color: var(--muted); font-size: .875rem; }
.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: center; min-width: max-content; }
th, td { padding: .65rem .68rem; }
thead th { color: var(--muted); background: #f6faf9; font-weight: 680; }
thead .dataset { color: var(--ink); font-size: .9rem; white-space: nowrap; padding-block: .66rem .33rem; }
.dataset small { font-size: .72rem; margin-left: .25rem; color: var(--muted); font-weight: 650; }
thead .ratio { padding-top: .18rem; padding-bottom: .55rem; font-size: .875rem; }
.boundary { border-left: 1px solid var(--line); }
.model-col { text-align: left; min-width: 145px; position: sticky; left: 0; z-index: 1; box-shadow: 1px 0 0 var(--line); }
tbody th, tbody td { background: var(--surface); border-top: 1px solid var(--line); }
tbody .reference th, tbody .reference td { background: #eaf4ef; }
.model-name { font-size: .94rem; font-weight: 760; display: block; white-space: nowrap; }
.model-mark { color: var(--muted); font-size: .75rem; font-weight: 620; white-space: nowrap; }
.reference .model-mark { color: var(--green); }
.numeric { font-variant-numeric: tabular-nums; }
.numeric strong { display: block; font-size: 1.06rem; letter-spacing: -.015em; }
.reference .numeric strong { font-weight: 680; }
.change { display: block; font-size: .76rem; font-weight: 700; margin-top: .1rem; }
.up { color: var(--green); }
.down { color: var(--negative); }
.state { white-space: nowrap; color: var(--muted); font-size: .875rem; font-weight: 520; }
.state.running { color: var(--blue); font-weight: 680; }
.state.failed { color: var(--negative); }
.footnote { color: var(--muted); font-size: .875rem; margin: .85rem 0 2.5rem; line-height: 1.55; }
.timeline-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; }
.panel { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.1rem; }
.panel details { border-top: 1px solid var(--line); margin-top: .7rem; padding-top: .7rem; }
.panel summary { cursor: pointer; font-weight: 730; }
.panel p, .panel li { color: var(--muted); font-size: .875rem; line-height: 1.55; }
.panel ul { padding-left: 1.15rem; }
.checkpoint { font-family: ui-monospace, monospace; overflow-wrap: anywhere; background: #f3f7f6; padding: .62rem; border-radius: 7px; }
#timeline { padding: 0; margin: .75rem 0 0; list-style: none; }
#timeline li { border-top: 1px solid var(--line); padding: .7rem 0; display: grid; grid-template-columns: 1fr auto; column-gap: .55rem; }
#timeline li strong { color: var(--ink); }
#timeline li small { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; }
.site-foot { padding: 2rem 0; display: flex; justify-content: space-between; gap: 1rem; color: var(--muted); font-size: .875rem; }
@media (max-width: 820px) {
  .shell { width: calc(100% - 2rem); }
  .hero { grid-template-columns: 1fr; gap: 1.15rem; padding: 1.6rem; }
  .focus { max-width: 480px; }
}
@media (max-width: 520px) {
  .mast-inner { min-height: 62px; gap: .7rem; }
  nav { gap: .66rem; }
  .mast-label { display: none; }
  .hero { margin-top: 1.1rem; padding: 1.35rem; border-radius: 16px; }
  .hero h1 { font-size: 2.15rem; }
  .timeline-grid { grid-template-columns: 1fr; }
  .model-col { min-width: 115px; }
  th, td { padding-inline: .52rem; }
}
</style>
</head>
<body>
  <header class="masthead">
    <div class="shell mast-inner">
      <a href="#top" class="brand">
        <span class="mark" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M11 29V11h6c8 0 12 4 12 9s-4 9-12 9h-6Z" stroke="currentColor" stroke-width="2.5"/><path d="M16 20h12" stroke="currentColor" stroke-width="2.5"/><circle cx="31" cy="11" r="3" fill="currentColor"/></svg></span>
        <span>胸片实验室<small>CXR RESEARCH</small></span>

    </div>
  </header>
  <main class="shell" id="top">
    <section class="hero" aria-labelledby="title">
      <div class="hero-content">
        <div class="eyebrow"><span></span> 自监督预训练 · 胸片</div>
        <h1 id="title">胸片模型评测台</h1>
        <p>按训练数据比例比较分类与分割性能。每一档都独立从同一份预训练权重开始。</p>
      </div>
      <aside class="focus" aria-label="当前模型评测进度">
        <span class="focus-label">本轮进度</span>
        <div class="focus-main"><strong id="current-name">—</strong><span id="progress-count">—</span></div>
        <div id="progress-bar" class="progress" aria-hidden="true"></div>
        <p id="last-updated">正在读取记录</p>
      </aside>
    </section>
    <section id="results" aria-labelledby="results-title">
      <div class="section-top">
        <div><div class="kicker">TEST RESULTS</div><h2 id="results-title">结果对照</h2></div>
        <button type="button" class="export" id="export">导出 CSV</button>
      </div>
      <div class="toolbar">
        <div class="filters" role="group" aria-label="训练数据比例">
          <button type="button" data-ratio="all" aria-pressed="true">全部比例</button>
          <button type="button" data-ratio="1" aria-pressed="false">1%</button>
          <button type="button" data-ratio="10" aria-pressed="false">10%</button>
          <button type="button" data-ratio="100" aria-pressed="false">100%</button>
        </div>
        <span class="legend"><i></i> ECAMP 固定为参考行 <span>·</span> 分数均以 % 表示</span>
      </div>
      <div id="boards"></div>
      <p class="footnote">小字为相对 ECAMP 的百分点差。ECAMP 为截图中的论文参考值；AM-RADIO 只收录正式测试集结果。未跑和进行中的档位不计分。</p>
    </section>
    <section id="history" aria-labelledby="history-title">
      <div class="section-top"><div><div class="kicker">RUN HISTORY</div><h2 id="history-title">实验记录</h2></div></div>
      <div class="timeline-grid">
        <div id="model-details" class="panel"></div>
        <div class="panel"><h3>已记录的测试结果</h3><ol id="timeline"></ol></div>
      </div>
    </section>
  </main>

_4gpu_b232_am_radio_ecamp2p5_20261126_143501"},{"kind":"eval","model":"am-radio-ecamp-2p5","task":"nih","ratio":10,"status":"done","score":83.272,"at":"2026-11-27T00:11:56+08:00","source":"Vanda · PBS 1630161 · The average AUROC is","run":"20261126_211309_735174_baseline224_4gpu_b232_am_radio_ecamp2p5_20261126_143501"},{"kind":"eval","model":"am-radio-ecamp-2p5","task":"rsna_cls","ratio":10,"status":"done","score":88.487,"at":"2026-11-26T21:49:19+08:00","source":"Vanda · PBS 1630155 · The average AUROC is","run":"20261126_204559_142137_baseline224_4gpu_b232_am_radio_ecamp2p5_20261126_143501"},{"kind":"eval","model":"am-radio-ecamp-5","task":"nih","ratio":10,"status":"done","score":83.289,"at":"2026-11-26T21:59:20+08:00","source":"4090 · GPU 3 · The average AUROC is","run":"20261126_193349_376915_baseline224_4gpu_b232_am_radio_ecamp5_20261126_143501"},{"kind":"eval","model":"am-radio-ecamp-5","task":"rsna_cls","ratio":1,"status":"done","score":85.147,"at":"2026-11-26T21:38:47+08:00","source":"Vanda · PBS 1630157 · The average AUROC is","run":"20261126_185922_714165_baseline224_4gpu_b232_am_radio_ecamp5_20261126_143501"},{"kind":"eval","model":"am-radio-ecamp-5","task":"rsna_cls","ratio":10,"status":"done","score":88.21,"at":"2026-11-26T23:02:54+08:00","source":"Vanda · PBS 1630157 · The average AUROC is","run":"20261126_213900_085645_baseline224_4gpu_b232_am_radio_ecamp5_20261126_143501"}]</script>
  <script>(() => {
  "use strict";
  const data = JSON.parse(document.getElementById("benchmark-data").textContent);
  const ratios = [1, 10, 100];
  const groups = [
    {name: "分类", tasks: [
      {id: "chexpert", name: "CheXpert", metric: "AUC"},
      {id: "rsna_cls", name: "RSNA", metric: "AUC"},
      {id: "covidx", name: "COVIDx", metric: "ACC"},
      {id: "nih", name: "NIH", metric: "AUROC"},
    ]},
    {name: "分割", tasks: [
      {id: "rsna_seg", name: "RSNA", metric: "Dice"},
      {id: "siim", name: "SIIM", metric: "Dice"},
    ]},
  ];
  const tasks = groups.flatMap(group => group.tasks);
  const models = data.filter(event => event.kind === "model");
  const modelById = new Map(models.map(model => [model.id, model]));
  const reference = data.find(event => event.kind === "reference");
  const events = data.filter(event => event.kind === "eval");
  const key = (model, task, ratio) => [model, task, ratio].join(":");
  const results = new Map(events.map(event => [key(event.model, event.task, event.ratio), event]));
  const labels = {done: "已完成", running: "运行中", waiting: "待上一档", queued: "排队中", failed: "失败"};
  const date = new Intl.DateTimeFormat("zh-CN", {timeZone: "Asia/Shanghai", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23"});
  const showDate = s => date.format(new Date(s));
  const byId = id => document.getElementById(id);
  function element(tag, text, css) {
    const node = document.createElement(tag);
    if (text !== undefined) node.textContent = text;
    if (css) node.className = css;
    return node;
  }
  function resultFor(model, task, ratio) {
    if (model.reference) return {status: "done", score: reference.scores[task.id][ratios.indexOf(ratio)]};
    return results.get(key(model.id, task.id, ratio));
  }
  function columns(group, fractions) {
    return group.tasks.flatMap(task => fractions.map((ratio, i) => ({task, ratio, border: i === 0})));
  }
  function renderTable(group, fractions) {
    const card = element("article", undefined, "card");
    const title = element("div", undefined, "card-heading");
    title.append(element("h3", group.name), element("span", group.tasks.length + " 个评测项"));
    const wrap = element("div", undefined, "table-wrap");
    wrap.tabIndex = 0;
    wrap.setAttribute("role", "region");
    wrap.setAttribute("aria-label", group.name + "结果表，可横向滚动");
    const table = element("table");
    const top = element("tr");
    const first = element("th", "模型", "model-col");
    first.scope = "col";
    first.rowSpan = 2;
    top.append(first);
    for (const task of group.tasks) {
      const th = element("th", task.name, "dataset boundary");
      th.scope = "colgroup";
      th.colSpan = fractions.length;
      th.append(element("small", task.metric));
      top.append(th);
    }
    const headers = element("tr");
    const cols = columns(group, fractions);
    for (const {ratio, border} of cols) {
      const th = element("th", ratio + "%", "ratio" + (border ? " boundary" : ""));
      th.scope = "col";
      headers.append(th);
    }
    const head = element("thead");
    head.append(top, headers);
    const body = element("tbody");
    for (const model of models) {
      const row = element("tr", undefined, model.reference ? "reference" : undefined);
      const name = element("th", undefined, "model-col");
      name.scope = "row";
      name.append(element("span", model.name, "model-name"), element("span", model.label || "实验模型", "model-mark"));
      row.append(name);
      for (const {task, ratio, border} of cols) {
        const td = element("td", undefined, border ? "boundary" : undefined);
        const result = resultFor(model, task, ratio);
        if (result?.status === "done") {
          td.classList.add("numeric");
          td.append(element("strong", result.score.toFixed(2)));
          if (!model.reference) {
            const delta = result.score - reference.scores[task.id][ratios.indexOf(ratio)];
            td.append(element("small", (delta >= 0 ? "+" : "−") + Math.abs(delta).toFixed(2),
              "change " + (delta >= 0 ? "up" : "down")));
          }
        } else if (result) {
          td.append(element("span", labels[result.status], "state " + result.status));
        } else {
          const label = model.id === "am-radio" && task.id === "chexpert" ? "跳过" : "—";
          const state = element("span", label, "state");
          state.title = label === "—" ? "未评测" : "本轮不评测 CheXpert";
          td.append(state);
        }
        if (result?.source) td.title = result.source + " · " + showDate(result.at);
        row.append(td);
      }
      body.append(row);
    }
    table.append(head, body);
    wrap.append(table);
    card.append(title, wrap);
    return card;
  }
  function render(fractions) {
    byId("boards").replaceChildren(...groups.map(group => renderTable(group, fractions)));
  }
  for (const button of document.querySelectorAll("[data-ratio]")) {
    button.addEventListener("click", () => {
      for (const peer of document.querySelectorAll("[data-ratio]")) peer.setAttribute("aria-pressed", String(peer === button));
      render(button.dataset.ratio === "all" ? ratios : [Number(button.dataset.ratio)]);
    });
  }
  const current = models.filter(model => !model.reference).at(-1);
  if (current) {
    const relevant = [...results.values()].filter(result => result.model === current.id);
    const time = relevant.map(e => e.at).sort((a, b) => new Date(b) - new Date(a))[0];
    byId("current-name").textContent = current.name;
    byId("progress-count").textContent = relevant.filter(x => x.status === "done").length + " / " + relevant.length + " 已完成";
    for (const state of ["done", "running", "waiting", "queued", "failed"]) {
      for (const _ of relevant.filter(x => x.status === state)) byId("progress-bar").append(element("span", undefined, state));
    }
    byId("last-updated").textContent = time ? "状态快照 " + showDate(time) + "（北京时间）" : "待录入评测记录";
  }
  const modelPanel = byId("model-details");
  modelPanel.append(element("h3", "模型与来源"));
  for (const model of models) {
    const detail = element("details");
    detail.open = current?.id === model.id;
    detail.append(element("summary", model.name), element("p", model.description || ""));
    const source = element("ul");
    for (const line of model.details || []) source.append(element("li", line));
    detail.append(source);
    if (model.checkpoint) detail.append(element("p", model.checkpoint, "checkpoint"));
    modelPanel.append(detail);
  }
  for (const result of events.filter(r => r.status === "done").sort((a, b) => new Date(b.at) - new Date(a.at))) {
    const task = tasks.find(task => task.id === result.task);
    const label = result.task === "rsna_seg" ? "RSNA 分割" : result.task === "rsna_cls" ? "RSNA 分类" : task.name;
    const row = element("li");
    row.append(element("strong", `${modelById.get(result.model).name} · ${label} ${result.ratio}%`),
      element("strong", `${result.score.toFixed(2)}% ${task.metric}`),
      element("small", showDate(result.at) + " · " + result.source));
    byId("timeline").append(row);
  }
  byId("export").addEventListener("click", () => {
    const rows = [["model", "task", "metric", "train_percentage", "test_score_percentage", "state", "observed_at"]];
    for (const model of models) for (const task of tasks) for (const ratio of ratios) {
      const result = resultFor(model, task, ratio);
      rows.push([model.name, task.id, task.metric, ratio, result?.score ?? "", result?.status ?? "not_run", result?.at ?? ""]);
    }
    const csv = rows.map(row => row.map(value => '"' + String(value).replaceAll('"', '""') + '"').join(",")).join("\n") + "\n";
    const link = element("a");
    link.href = URL.createObjectURL(new Blob(["\ufeff", csv], {type: "text/csv;charset=utf-8"}));
    link.download = "cxr-benchmark.csv";
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  });
  render(ratios);
})();
</script>
